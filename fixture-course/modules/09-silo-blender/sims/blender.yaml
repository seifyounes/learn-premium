kind: scl
title: The blending station, running
caption: Set the load cells and the buttons, then step a statement or run a whole scan. Each scan calls the Blender block once; the trace shows what every statement decided and wrote.
recompute: independent
worked: "1"
sheet:
  D2: total_kg
  E2: fill_pct
  F2: bags
model:
  block: Blender
  source: |
    // A blending station: three silos dose into one hopper, then a mixer runs the batch.
    TYPE "Silo"
    STRUCT
        target_kg : REAL;               // the recipe's weight from this silo
        raw       : INT;                // load cell: 0..27648 = 0..500 kg
        kg        : REAL;               // the weight it reads
        short     : BOOL;               // still under its target
    END_STRUCT
    END_TYPE

    DATA_BLOCK "Recipe"
    VAR
        silo    : ARRAY[1..3] OF "Silo";
        batches : INT;                  // batches mixed so far
    END_VAR
    BEGIN
        silo[1].target_kg := 120.0;
        silo[2].target_kg := 80.0;
        silo[3].target_kg := 120.0;
    END_DATA_BLOCK

    FUNCTION ToKg : REAL
    VAR_INPUT
        raw : INT;
    END_VAR
    BEGIN
        ToKg := INT_TO_REAL(raw) / 27648.0 * 500.0;
    END_FUNCTION

    FUNCTION_BLOCK "Blender"
    VAR_INPUT
        start : BOOL;                   // the operator's start button
        raw1  : INT;                    // the three load cells
        raw2  : INT;
        raw3  : INT;
        mixed : BOOL;                   // the mixer's timer has run out
    END_VAR
    VAR_OUTPUT
        valve    : INT;                 // the silo dosing now, 0 = none
        total_kg : REAL;                // in the hopper
        fill_pct : REAL;                // of the batch's weight
        bags     : INT;                 // 25 kg bags the hopper fills
        mixer    : BOOL;
    END_VAR
    VAR
        step       : INT;               // 0 IDLE, 1 DOSE, 2 MIX
        last_start : BOOL;              // start, one scan ago
    END_VAR
    VAR_TEMP
        i      : INT;
        target : REAL;
    END_VAR
    BEGIN
    "Recipe".silo[1].raw := raw1;
    "Recipe".silo[2].raw := raw2;
    "Recipe".silo[3].raw := raw3;
    total_kg := 0.0;
    target := 0.0;
    FOR i := 1 TO 3 DO
        "Recipe".silo[i].kg := ToKg(raw := "Recipe".silo[i].raw);
        "Recipe".silo[i].short := "Recipe".silo[i].kg < "Recipe".silo[i].target_kg;
        total_kg := total_kg + "Recipe".silo[i].kg;
        target := target + "Recipe".silo[i].target_kg;
    END_FOR;
    fill_pct := total_kg / target * 100.0;
    bags := REAL_TO_INT(total_kg / 25.0);   // 312.5 kg is 12.5 bags
    valve := 0;
    CASE step OF
        0:  // IDLE: wait for start to rise
            IF start AND NOT last_start THEN
                step := 1;
            END_IF;
        1:  // DOSE: open the first silo still short
            FOR i := 1 TO 3 DO
                IF "Recipe".silo[i].short THEN
                    valve := i;
                    EXIT;
                END_IF;
            END_FOR;
            IF valve = 0 THEN
                step := 2;
            END_IF;
        2:  // MIX: run the mixer until its timer runs out
            mixer := NOT mixed;
            IF mixed THEN
                "Recipe".batches := "Recipe".batches + 1;
                step := 0;
            END_IF;
    ELSE
        step := 0;
    END_CASE;
    last_start := start;
    END_FUNCTION_BLOCK
  watch:
    - step
    - valve
    - total_kg
    - fill_pct
    - bags
    - mixer
    - Recipe.silo[1].kg
    - Recipe.silo[2].kg
    - Recipe.silo[3].kg
    - Recipe.batches
