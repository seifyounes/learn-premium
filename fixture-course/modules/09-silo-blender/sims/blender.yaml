walkthrough:
  - title: The data
    lines: 1-20
    note: The first slide declares a silo as a type and the recipe as a DB holding three of them, with their targets.
  - title: Weighing every silo
    lines: 22-28, 30-67, 93
    note: The next slide adds ToKg and the block's first half, which weighs each silo with a FOR loop and works out the totals.
  - title: The batch sequence
    lines: 68-92
    note: The last slide adds the sequence, a CASE over the step, and shows CASE's syntax on its own first.
    fragment: |
      CASE selector OF
          value1 : statements;
          value2, value3 : statements;
          low..high : statements;
      ELSE
          statements;
      END_CASE;
divergences:
  - line: 66
    exam: $13$ bags, the Professor rounding $12.5$ up
    note: rounds a tie to the even number in REAL_TO_INT, so it holds $12$ in bags.
provenance:
  stated:
    - "the load cells: raw $0$ to $27648$ is $0$ to $500$ kg"
    - the recipe's $120$, $80$ and $120$ kg, and bags of $25$ kg
    - the raw values $6480$, $4320$, $7344$, $4536$ and $6912$
    - a BOOL is $0$ or $1$
  derived:
    - $12.5$ bags, held as $12$
  divergences:
    - value: $13$ bags
      note: REAL_TO_INT rounds $12.5$ to the even number on a real S7, so the CPU holds $12$.
