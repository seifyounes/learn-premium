covers: a hard-wired start/stop rung between the left and right rails, its coil passing the current on through an NC overload contact and two contacts in parallel to the right rail, and a lamp coil straight on to the right rail, in LAD
model:
  language: LAD
  parts:
    - { id: L1, kind: power-rail, network: 1, label: L1 }
    - { id: Stop, kind: nc, network: 1, operand: I 0.0, label: Stop }
    - { id: Start, kind: "no", network: 1, operand: I 0.1, label: Start }
    - { id: Hold, kind: "no", network: 1, operand: Q 4.0, label: K1 }
    - { id: K1, kind: coil, network: 1, operand: Q 4.0, label: K1 }
    - { id: OL, kind: nc, network: 1, operand: I 0.2, label: OL }
    - { id: Door, kind: "no", network: 1, operand: I 0.3, label: Door }
    - { id: Bypass, kind: "no", network: 1, operand: I 0.4, label: Bypass }
    - { id: L2, kind: power-rail-right, network: 1, label: L2 }
    - { id: L1b, kind: power-rail, network: 2 }
    - { id: Run, kind: "no", network: 2, operand: Q 4.0, label: K1 }
    - { id: H1, kind: coil, network: 2, operand: Q 4.1, label: H1 }
    - { id: L2b, kind: power-rail-right, network: 2 }
  nets:
    - { id: l1, pins: [L1.t, Stop.in] }
    - { id: stop, pins: [Stop.out, Start.in, Hold.in] }
    - { id: latch, pins: [Start.out, Hold.out, K1.in] }
    - { id: coil, pins: [K1.out, OL.in] }
    - { id: ol, pins: [OL.out, Door.in, Bypass.in] }
    - { id: l2, pins: [Door.out, Bypass.out, L2.t] }
    - { id: l1b, pins: [L1b.t, Run.in] }
    - { id: lamp, pins: [Run.out, H1.in] }
    - { id: l2b, pins: [H1.out, L2b.t] }
  inputs: [I 0.0, I 0.1, I 0.2, I 0.3, I 0.4]
  watch: { Q 4.0: BOOL, Q 4.1: BOOL }
cycle: 100
start: { I 0.0: 0, I 0.1: 0, I 0.2: 0, I 0.3: 1, I 0.4: 0 }
cases:
  - name: started and held, tripped by the overload, started into a tripped overload, opened after the coil, run through the bypass, and stopped
    until: 1800
    events:
      - { at: 100, set: { I 0.1: 1 } }
      - { at: 200, set: { I 0.1: 0 } }
      - { at: 400, set: { I 0.2: 1 } }
      - { at: 500, set: { I 0.2: 0 } }
      - { at: 600, set: { I 0.1: 1 } }
      - { at: 700, set: { I 0.2: 1 } }
      - { at: 800, set: { I 0.2: 0 } }
      - { at: 900, set: { I 0.1: 0 } }
      - { at: 1000, set: { I 0.3: 0 } }
      - { at: 1100, set: { I 0.4: 1 } }
      - { at: 1200, set: { I 0.1: 1 } }
      - { at: 1300, set: { I 0.1: 0 } }
      - { at: 1500, set: { I 0.0: 1 } }
      - { at: 1600, set: { I 0.0: 0 } }
