covers: every compare of INT, DINT and REAL, which writes the RLO outright, and an unordered REAL compare
model:
  source: |
    ORGANIZATION_BLOCK OB 1
    TITLE = Compares
    BEGIN
    NETWORK
    TITLE = INT
          L     MW     0
          L     MW     2
          ==I
          =     Q      0.0
          A     I      0.0
          L     MW     0
          L     MW     2
          <>I
          =     Q      0.1
          ON    I      0.0
          L     MW     0
          L     MW     2
          >I
          =     Q      0.2
          L     MW     0
          L     MW     2
          <I
          =     Q      0.3
          L     MW     0
          L     MW     2
          >=I
          =     Q      0.4
          L     MW     0
          L     MW     2
          <=I
          A     I      0.0
          =     Q      0.5
    NETWORK
    TITLE = DINT
          L     MD     4
          L     MD     8
          ==D
          =     Q      1.0
          L     MD     4
          L     MD     8
          <>D
          =     Q      1.1
          L     MD     4
          L     MD     8
          >D
          =     Q      1.2
          L     MD     4
          L     MD     8
          <D
          =     Q      1.3
          L     MD     4
          L     MD     8
          >=D
          =     Q      1.4
          L     MD     4
          L     MD     8
          <=D
          =     Q      1.5
    NETWORK
    TITLE = REAL
          L     MD    12
          L     MD    16
          ==R
          =     Q      2.0
          L     MD    12
          L     MD    16
          <>R
          =     Q      2.1
          L     MD    12
          L     MD    16
          >R
          =     Q      2.2
          L     MD    12
          L     MD    16
          <R
          =     Q      2.3
          L     MD    12
          L     MD    16
          >=R
          =     Q      2.4
          L     MD    12
          L     MD    16
          <=R
          =     Q      2.5
          L     -1.0
          SQRT
          L     MD    12
          ==R
          =     Q      2.6
          L     MD    12
          L     -1.0
          SQRT
          <>R
          =     Q      2.7
    END_ORGANIZATION_BLOCK
  inputs:
    I 0.0: BOOL
    MW 0: INT
    MW 2: INT
    MD 4: DINT
    MD 8: DINT
    MD 12: REAL
    MD 16: REAL
  watch:
    QB 0: BYTE
    QB 1: BYTE
    QB 2: BYTE
start:
  I 0.0: 1
  MW 0: 3
  MW 2: 3
  MD 4: 70000
  MD 8: -70000
  MD 12: 1.5
  MD 16: 1.5
tune:
  I 0.0: { min: 0, max: 1, step: 1 }
  MW 0: { min: -32768, max: 32767, step: 1 }
  MW 2: { min: -32768, max: 32767, step: 1 }
  MD 4: { min: -2147483648, max: 2147483647, step: 1 }
  MD 8: { min: -2147483648, max: 2147483647, step: 1 }
  MD 12: { min: -1000, max: 1000, step: 0.5 }
  MD 16: { min: -1000, max: 1000, step: 0.5 }
cases:
  - name: less, equal, greater
    scans:
      - { MW 0: -4, MW 2: 4, MD 4: -1, MD 8: 1, MD 12: -0.25, MD 16: 0.25, I 0.0: 0 }
      - { MW 0: 4, MW 2: -4, MD 4: 1, MD 8: -1, MD 12: 0.25, MD 16: -0.25 }
      - { MW 0: 0, MW 2: 0, MD 4: 0, MD 8: 0, MD 12: 0, MD 16: -0.0 }
  - name: REAL extremes and denormal differences
    scans:
      - { MD 12: 3.0e+38, MD 16: -3.0e+38 }
      - { MD 12: 1.0e-45, MD 16: 0 }
      - { MD 12: 1.17549435e-38, MD 16: 1.0e-45 }
