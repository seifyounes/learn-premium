# The live gates on the Fixture Course's Vercel project, after every production deploy. Vercel's
# Git integration deploys `main` and reports it to GitHub as a deployment; once production serves
# it, this runs the live gates on the live URL. Green marks the commit green (the rollback's "last
# green"). Red rolls Vercel back to the last green deployment and opens an issue for the Owner.
#
# Run it by hand with `drill` to force a red verdict: the rollback and the Owner's report, end to end.
#
# Needs the repo secret VERCEL_TOKEN and the repo variables VERCEL_PROJECT_ID, FIXTURE_LIVE_URL and,
# for a team-owned project, VERCEL_TEAM_ID (docs/deploy.md).
name: Fixture live gates

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      drill:
        description: "Force a red verdict: roll production back and report to the Owner"
        type: boolean
        default: false

permissions:
  contents: read
  statuses: write
  issues: write

# One live run at a time; a newer deploy waits for the run before it rather than racing its rollback.
concurrency:
  group: fixture-live
  cancel-in-progress: false

jobs:
  live:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      LIVE_URL: ${{ vars.FIXTURE_LIVE_URL }}
      SHA: ${{ github.event.deployment.sha || github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: template/.node-version
          cache: npm
          cache-dependency-path: template/package-lock.json
      - run: npm ci
      # `state` is `live` once production serves this commit's deployment, or `superseded` when a
      # newer deployment already took production over; that one's own run checks it.
      - name: Wait until production serves this commit
        id: await
        run: npm run deploy -- await-live --sha "$SHA"
      # The pages to expect come from the same build Vercel made.
      - name: Build what Vercel built
        if: steps.await.outputs.state == 'live'
        run: npm run build
        env:
          VERCEL_ENV: production
      - name: Live gates
        id: gates
        if: steps.await.outputs.state == 'live'
        continue-on-error: true
        run: npm run gates -- run --point live --url "$LIVE_URL" --report "$RUNNER_TEMP/live-report.json"
      # Before the verdict, so it measures this deployment: a rollback moves the live URL. Only on
      # green gates, so a red deploy's rollback isn't held up. Chromium installs here, not up front:
      # the report never blocks, and neither may its setup.
      - name: Performance (reported, never blocking)
        if: steps.gates.outcome == 'success'
        continue-on-error: true
        run: |
          npx playwright install --with-deps chromium
          npm run deploy -- performance --url "$LIVE_URL" --lighthouse
      # Once production serves the commit, the verdict always runs: gates that couldn't run (a
      # failed build included) count as failed, and fail the live site back to the last green. It
      # settles nothing if production moved to a newer deployment meanwhile.
      - name: Verdict (red rolls Vercel back)
        id: verdict
        if: always() && steps.await.outputs.state == 'live'
        env:
          DEPLOYMENT: ${{ steps.await.outputs.deployment }}
        run: >-
          npm run deploy -- verdict --sha "$SHA" --deployment "$DEPLOYMENT" --live-url "$LIVE_URL"
          --report "$RUNNER_TEMP/live-report.json" --out "$RUNNER_TEMP/owner"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          ${{ inputs.drill && '--drill' || '' }}
      - name: Tell the Owner
        if: failure() && steps.verdict.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          owner="$RUNNER_TEMP/owner"
          if [ ! -s "$owner/issue-title.txt" ]; then
            mkdir -p "$owner"
            echo "Live verdict for ${SHA::7} crashed" > "$owner/issue-title.txt"
            printf 'The verdict step failed before it could roll back or report. Production may still serve %s.\n\nRun: %s\n' "$SHA" "$RUN_URL" > "$owner/issue-body.md"
          fi
          gh issue create --title "$(cat "$owner/issue-title.txt")" \
            --body-file "$owner/issue-body.md" --assignee "$GITHUB_REPOSITORY_OWNER"
      - name: Tell the Owner the deploy never went live
        if: failure() && steps.await.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.await.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Production never served $SHA, so the live gates didn't run and nothing was rolled back."
            echo
            echo "${REASON:-See the run.}"
            echo
            echo "Run: $RUN_URL"
          } > "$RUNNER_TEMP/never-live.md"
          gh issue create --title "Deploy of ${SHA::7} never went live" \
            --body-file "$RUNNER_TEMP/never-live.md" --assignee "$GITHUB_REPOSITORY_OWNER"
      # npm ci (or anything else before await-live) failed: the deploy went out unchecked.
      - name: Tell the Owner the live check couldn't start
        if: failure() && steps.await.outcome == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The live check of $SHA failed before it could wait for the deploy, so production"
            echo "was neither checked nor rolled back. Re-run the workflow once the failing step is fixed."
            echo
            echo "Run: $RUN_URL"
          } > "$RUNNER_TEMP/not-started.md"
          gh issue create --title "Live check of ${SHA::7} couldn't start" \
            --body-file "$RUNNER_TEMP/not-started.md" --assignee "$GITHUB_REPOSITORY_OWNER"
