# Builds the Fixture Course with the Site template on every template change, and runs the
# template's own checks. A red run means the template may not be released.
name: Template CI

# Every branch, so a ticket branch is green before it merges; a PR shows its head commit's run.
on:
  push:
    paths:
      - "template/**"
      - "fixture-course/**"
      - ".github/workflows/template-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: template/.node-version
          cache: npm
          cache-dependency-path: template/package-lock.json
      - run: npm ci
      # The sims' browser tests drive Chromium; the browser gates run Chromium and WebKit (WebKit
      # stands in for iPhone Safari).
      - name: Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint -- --max-warnings 0
      - name: Type check (astro check)
        run: npm run check
      - name: Tests (Vitest; builds the Fixture Course, and runs the gate runner and its negative controls)
        run: npm test
      - name: Build the Fixture Course
        run: npm run build
      # Every gate point through the one entry. Each writes a Gate report bound to this commit and
      # exits red on a block, a crash, or a gate that covered nothing.
      - name: Gates per job and per Module
        run: |
          for dir in ../fixture-course/modules/*/; do
            module=$(basename "$dir")
            npm run gates -- run --point job --module "$module"
            npm run gates -- verify --point job --module "$module"
            npm run gates -- run --point module --module "$module"
            npm run gates -- verify --point module --module "$module"
          done
      # The per-Module loop above opens each Module's page; the hub pages (home) get theirs here.
      - name: Browser gates on every page
        run: |
          npm run gates -- run --point module
          npm run gates -- verify --point module
      # Before merge, the deploy gates check what Vercel's production deploy builds: no Trap page.
      - name: Build the Fixture Course as Vercel's production deploy does
        run: npm run build -- --outDir dist-production
        env:
          VERCEL_ENV: production
      - name: Gates per deploy
        run: |
          npm run gates -- run --point deploy --dist dist-production
          npm run gates -- verify --point deploy
      # The live gates, on that build served the way Vercel serves it under vercel.json. After the
      # deploy, fixture-live.yml runs them again on the live URL.
      - name: Live gates on the Vercel-like server
        run: |
          npm run gates -- run --point live --dist dist-production
          npm run gates -- verify --point live
      - name: Performance (reported, never blocking)
        continue-on-error: true
        run: npm run deploy -- performance --dist dist-production
      # A negative control that passes means its gate can't see its defect: CI goes red.
      - name: Negative controls
        run: npm run gates -- controls
